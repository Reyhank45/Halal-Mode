name: Build Magisk Module

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip

      - name: Validate Python scripts
        run: |
          python -m py_compile add_blocker.py

      - name: Build module with Makefile
        run: make

      - name: Generate update metadata
        run: |
          id=$(grep '^id=' module.prop | cut -d= -f2)
          name=$(grep '^name=' module.prop | cut -d= -f2)
          version=$(grep '^version=' module.prop | cut -d= -f2)
          versionCode=$(grep '^versionCode=' module.prop | cut -d= -f2)
          description=$(grep '^description=' module.prop | cut -d= -f2)
          author=$(grep '^author=' module.prop | cut -d= -f2)
          downloadUrl="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${id}-${version}.zip"

          cat > update.json <<EOF
{
  "id": "${id}",
  "name": "${name}",
  "version": "${version}",
  "versionCode": ${versionCode},
  "description": "${description}",
  "author": "${author}",
  "downloadUrl": "${downloadUrl}",
  "website": "https://github.com/${GITHUB_REPOSITORY}"
}
EOF

      - name: List build output
        run: ls -la build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: halal-mode-module
          path: build/*.zip

      - name: Upload update metadata as artifact
        uses: actions/upload-artifact@v4
        with:
          name: halal-mode-update-json
          path: update.json
